<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAO - Maintenance Tasks</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">GMAO</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/equipment.html">Equipment</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/maintenance.html">Maintenance</a>
          </li>
        </ul>
        <button id="logout-btn" class="btn btn-outline-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Maintenance Task Management</h1>
    </div>

    <div class="card mb-4">
      <div class="card-header">Add New Maintenance Task</div>
      <div class="card-body">
        <form id="add-task-form">
          <div class="row g-3">
            <div class="col-12">
              <label for="task-description" class="form-label">Task Description</label>
              <input type="text" class="form-control" id="task-description" placeholder="e.g., Change oil filter" required>
            </div>
            <div class="col-md-6">
              <label for="task-equipment" class="form-label">Equipment</label>
              <select class="form-select" id="task-equipment" required></select>
            </div>
            <div class="col-md-6">
              <label for="task-type" class="form-label">Task Type</label>
              <select class="form-select" id="task-type">
                <option value="date-based">Date-Based</option>
                <option value="usage-based">Usage-Based</option>
              </select>
            </div>
            <div class="col-md-6" id="date-based-fields">
              <label for="task-due-date" class="form-label">Due Date</label>
              <input type="date" class="form-control" id="task-due-date">
            </div>
            <div class="col-md-6 d-none" id="usage-based-fields">
              <label for="task-interval-hours" class="form-label">Interval (Running Hours)</label>
              <input type="number" class="form-control" id="task-interval-hours" placeholder="e.g., 3000">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add Task</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
        <div class="card-header">Maintenance Task List</div>
        <div class="card-body">
            <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Description</th>
                    <th>Equipment</th>
                    <th>Schedule</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="task-list"></tbody>
            </table>
            </div>
        </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const taskForm = document.getElementById('add-task-form');
    const taskList = document.getElementById('task-list');
    const equipmentSelect = document.getElementById('task-equipment');
    const taskTypeSelect = document.getElementById('task-type');
    const logoutBtn = document.getElementById('logout-btn');

    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html';
    }

    const authHeaders = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
    };

    // Toggle form fields based on task type
    taskTypeSelect.addEventListener('change', () => {
        const isUsageBased = taskTypeSelect.value === 'usage-based';
        document.getElementById('usage-based-fields').classList.toggle('d-none', !isUsageBased);
        document.getElementById('date-based-fields').classList.toggle('d-none', isUsageBased);
    });

    // Fetch and populate equipment for the dropdown
    async function populateEquipment() {
      const response = await fetch('/equipment', { headers: authHeaders });
      if (response.status === 401) window.location.href = '/login.html';
      const equipment = await response.json();
      equipmentSelect.innerHTML = '<option value="">Select Equipment</option>';
      equipment.forEach(item => {
        const option = new Option(`${item.name} (${item.Location ? item.Location.name : 'N/A'})`, item.id);
        equipmentSelect.add(option);
      });
    }

    // Fetch and display maintenance tasks
    async function getTasks() {
      const response = await fetch('/maintenance-tasks', { headers: authHeaders });
      if (response.status === 401) window.location.href = '/login.html';
      const tasks = await response.json();
      taskList.innerHTML = '';
      tasks.forEach(task => {
        const row = document.createElement('tr');
        const equipment = task.Equipment;
        let schedule = '';
        let status = '';

        if (task.task_type === 'date-based') {
            schedule = `Due: ${new Date(task.due_date).toLocaleDateString()}`;
            status = task.completed ? '<span class="badge bg-success">Completed</span>' : (new Date(task.due_date) < new Date() ? '<span class="badge bg-danger">Overdue</span>' : '<span class="badge bg-warning">Pending</span>');
        } else {
            schedule = `Every ${task.interval_hours} hrs. Next due at ${task.next_due_hours} hrs.`;
            status = equipment && equipment.running_hours >= task.next_due_hours ? '<span class="badge bg-danger">Due for Maintenance</span>' : '<span class="badge bg-info">Scheduled</span>';
        }

        row.innerHTML = `
            <td>${task.id}</td>
            <td>${task.description}</td>
            <td>${equipment ? equipment.name : 'N/A'}</td>
            <td>${schedule}</td>
            <td>${status}</td>
            <td>
              <button class="btn btn-sm btn-success" onclick="completeTask(${task.id})" ${task.completed ? 'disabled' : ''}>Complete</button>
              <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">Delete</button>
            </td>
        `;
        taskList.appendChild(row);
      });
    }

    // Add new task
    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newTask = {
        description: document.getElementById('task-description').value,
        EquipmentId: document.getElementById('task-equipment').value,
        task_type: taskTypeSelect.value,
        due_date: taskTypeSelect.value === 'date-based' ? document.getElementById('task-due-date').value : null,
        interval_hours: taskTypeSelect.value === 'usage-based' ? parseInt(document.getElementById('task-interval-hours').value, 10) : null,
      };
      await fetch('/maintenance-tasks', {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify(newTask),
      });
      taskForm.reset();
      getTasks();
    });

    // Complete task
    async function completeTask(id) {
        await fetch(`/maintenance-tasks/${id}`, {
            method: 'PUT',
            headers: authHeaders,
            body: JSON.stringify({ completed: true }),
        });
        getTasks();
    }

    // Delete task
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      await fetch(`/maintenance-tasks/${id}`, { method: 'DELETE', headers: authHeaders });
      getTasks();
    }

    // Logout
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
      populateEquipment();
      getTasks();
    });
  </script>
</body>
</html>
