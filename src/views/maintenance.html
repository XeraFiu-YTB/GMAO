<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAO - Maintenance Tasks</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">GMAO</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/equipment.html">Equipment</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/maintenance.html">Maintenance</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Maintenance Task Management</h1>
      <a href="/equipment.html" class="btn btn-secondary">Go to Equipment</a>
    </div>

    <div class="card">
      <div class="card-header">
        Add New Maintenance Task
      </div>
      <div class="card-body">
        <form id="add-task-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="task-description" class="form-label">Task Description</label>
              <input type="text" class="form-control" id="task-description" placeholder="e.g., Change oil filter" required>
            </div>
            <div class="col-md-6">
              <label for="task-equipment" class="form-label">Equipment</label>
              <select class="form-select" id="task-equipment" required>
                <!-- Equipment options will be populated here -->
              </select>
            </div>
            <div class="col-md-6">
              <label for="task-due-date" class="form-label">Due Date</label>
              <input type="date" class="form-control" id="task-due-date">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add Task</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <h2 class="mt-5">Maintenance Task List</h2>
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Equipment</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="task-list">
          <!-- Task data will be populated here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const taskForm = document.getElementById('add-task-form');
    const taskList = document.getElementById('task-list');
    const equipmentSelect = document.getElementById('task-equipment');

    // Fetch and populate equipment for the dropdown
    async function populateEquipment() {
      try {
        const response = await fetch('/equipment');
        const equipment = await response.json();
        equipmentSelect.innerHTML = '<option value="">Select Equipment</option>';
        equipment.forEach(item => {
          const option = document.createElement('option');
          option.value = item.id;
          option.textContent = `${item.name} (${item.location})`;
          equipmentSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to fetch equipment:', error);
      }
    }

    // Fetch and display maintenance tasks
    async function getTasks() {
      try {
        const response = await fetch('/maintenance-tasks');
        const tasks = await response.json();
        taskList.innerHTML = '';
        if (tasks.length === 0) {
          taskList.innerHTML = '<tr><td colspan="6" class="text-center">No maintenance tasks found.</td></tr>';
          return;
        }

        tasks.forEach(task => {
          const row = document.createElement('tr');
          const status = task.completed ? '<span class="badge bg-success">Completed</span>' : '<span class="badge bg-warning">Pending</span>';
          row.innerHTML = `
            <td>${task.id}</td>
            <td>${task.description}</td>
            <td>${task.Equipment ? task.Equipment.name : 'N/A'}</td>
            <td>${task.due_date ? new Date(task.due_date).toLocaleDateString() : ''}</td>
            <td>${status}</td>
            <td>
              <button class="btn btn-sm ${task.completed ? 'btn-secondary' : 'btn-success'}" onclick="toggleTaskStatus(${task.id}, ${task.completed})">
                ${task.completed ? 'Mark as Pending' : 'Mark as Complete'}
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">Delete</button>
            </td>
          `;
          taskList.appendChild(row);
        });
      } catch (error) {
        console.error('Failed to fetch tasks:', error);
        taskList.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load tasks.</td></tr>';
      }
    }

    // Add new task
    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newTask = {
        description: document.getElementById('task-description').value,
        EquipmentId: document.getElementById('task-equipment').value,
        due_date: document.getElementById('task-due-date').value || null,
      };

      try {
        await fetch('/maintenance-tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTask),
        });
        taskForm.reset();
        getTasks();
      } catch (error) {
        console.error('Failed to add task:', error);
      }
    });

    // Toggle task status
    async function toggleTaskStatus(id, currentStatus) {
      try {
        await fetch(`/maintenance-tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !currentStatus }),
        });
        getTasks();
      } catch (error) {
        console.error('Failed to update task status:', error);
      }
    }

    // Delete task
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) {
        return;
      }
      try {
        await fetch(`/maintenance-tasks/${id}`, { method: 'DELETE' });
        getTasks();
      } catch (error) {
        console.error('Failed to delete task:', error);
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
      populateEquipment();
      getTasks();
    });
  </script>
</body>
</html>
